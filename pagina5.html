<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recompensa</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="estilo.css">

</head>


<body class="pagina-recompensa">

    <main class="tela-recompensa">

        <div class="recompensa-conteudo">

            <!-- TOPO -->

            <!-- TÍTULO -->

            <h1 class="recompensa-titulo">

                SUA

                <span>
                    RECOMPENSA
                </span>

            </h1>


            <p class="raspe-texto">
                RASPE PARA REVELAR SEU CÓDIGO
            </p>


            <!-- RASPADINHA -->

            <div class="raspadinha">

                <!-- CÓDIGO QUE FICA POR BAIXO -->

                <div class="codigo-premio">

                    <span class="codigo-label">
                        CÓDIGO DO PRESENTE
                    </span>

                    <strong id="codigo">
                        GTA6-REGI-2026
                    </strong>

                </div>


                <!-- CAMADA QUE SERÁ RASPADA -->

                <canvas
                    id="raspadinhaCanvas">
                </canvas>

            </div>


            <!-- STATUS -->

            <p
                class="status-raspadinha"
                id="statusRaspadinha"
            >
                CONTINUE RASPANDO...
            </p>


            <!-- COPIAR -->

            <button
                class="botao-copiar"
                id="botaoCopiar"
                disabled
            >

                <span id="textoCopiar">
                    COPIAR CÓDIGO
                </span>

                <span class="icone-copiar">
                    ⧉
                </span>

            </button>


            <p
                class="copiado"
                id="mensagemCopiado"
            >
                CÓDIGO COPIADO!
            </p>


        </div>


        <!-- RODAPÉ -->

        <div class="codigo-missao-final">

            <span>
                MISSION_05
            </span>

            <span>
                ///
            </span>

            <span>
                REWARD_UNLOCKED
            </span>

        </div>

    </main>


    <script>

        /* =========================================
           CÓDIGO DO PRESENTE
        ========================================= */

        const codigoPremio = "XXXX-XXXX-XXXX";

        document.getElementById("codigo").textContent = codigoPremio;


        /* =========================================
           CANVAS
        ========================================= */

        const canvas = document.getElementById("raspadinhaCanvas");

        const ctx = canvas.getContext("2d");

        const raspadinha = document.querySelector(".raspadinha");

        let raspando = false;

        let totalRaspado = 0;

        let liberado = false;


        /* =========================================
           CONFIGURAÇÃO
        ========================================= */

        function configurarCanvas() {

            const largura = raspadinha.clientWidth;
            const altura = raspadinha.clientHeight;

            const dpr = window.devicePixelRatio || 1;

            canvas.width = largura * dpr;
            canvas.height = altura * dpr;

            canvas.style.width = largura + "px";
            canvas.style.height = altura + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);


            /* Fundo da raspadinha */

            const gradiente = ctx.createLinearGradient(
                0,
                0,
                largura,
                altura
            );

            gradiente.addColorStop(0, "#292d38");
            gradiente.addColorStop(0.5, "#171b24");
            gradiente.addColorStop(1, "#303541");

            ctx.fillStyle = gradiente;

            ctx.fillRect(
                0,
                0,
                largura,
                altura
            );


            /* textura */

            for (let i = 0; i < 900; i++) {

                const x = Math.random() * largura;
                const y = Math.random() * altura;

                ctx.fillStyle =
                    Math.random() > 0.5
                        ? "rgba(255,255,255,0.035)"
                        : "rgba(0,0,0,0.08)";

                ctx.fillRect(
                    x,
                    y,
                    1,
                    1
                );

            }


            /* texto da raspadinha */

            ctx.font =
                "600 10px Montserrat, sans-serif";

            ctx.textAlign = "center";

            ctx.fillStyle =
                "rgba(255,255,255,0.55)";

            ctx.fillText(
                "RASPE AQUI",
                largura / 2,
                altura / 2 + 4
            );

        }


        configurarCanvas();


        window.addEventListener(
            "resize",
            configurarCanvas
        );


        /* =========================================
           RASPAR
        ========================================= */

        function obterPosicao(event) {

            const rect =
                canvas.getBoundingClientRect();

            let x;
            let y;


            if (event.touches) {

                x =
                    event.touches[0].clientX
                    - rect.left;

                y =
                    event.touches[0].clientY
                    - rect.top;

            } else {

                x =
                    event.clientX
                    - rect.left;

                y =
                    event.clientY
                    - rect.top;

            }


            return {
                x: x,
                y: y
            };

        }


        function raspar(event) {

            if (!raspando || liberado) {
                return;
            }

            event.preventDefault();


            const posicao =
                obterPosicao(event);


            ctx.globalCompositeOperation =
                "destination-out";


            ctx.beginPath();

            ctx.arc(
                posicao.x,
                posicao.y,
                22,
                0,
                Math.PI * 2
            );

            ctx.fill();


            calcularAreaRaspada();

        }


        /* =========================================
           ÁREA RASPADA
        ========================================= */

        function calcularAreaRaspada() {

            const imagem =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


            let transparentes = 0;

            const total =
                imagem.data.length / 4;


            for (
                let i = 3;
                i < imagem.data.length;
                i += 4
            ) {

                if (imagem.data[i] === 0) {
                    transparentes++;
                }

            }


            totalRaspado =
                (transparentes / total) * 100;


            if (totalRaspado >= 45) {

                liberarCodigo();

            }

        }


        /* =========================================
           MOUSE
        ========================================= */

        canvas.addEventListener(
            "mousedown",
            function () {

                raspando = true;

            }
        );


        canvas.addEventListener(
            "mousemove",
            raspar
        );


        window.addEventListener(
            "mouseup",
            function () {

                raspando = false;

            }
        );


        /* =========================================
           TOUCH
        ========================================= */

        canvas.addEventListener(
            "touchstart",
            function (event) {

                raspando = true;

                raspar(event);

            },
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "touchmove",
            raspar,
            {
                passive: false
            }
        );


        canvas.addEventListener(
            "touchend",
            function () {

                raspando = false;

            }
        );


        /* =========================================
           LIBERAR CÓDIGO
        ========================================= */

        function liberarCodigo() {

            if (liberado) {
                return;
            }

            liberado = true;


            const status =
                document.getElementById(
                    "statusRaspadinha"
                );

            status.textContent =
                "✓ CÓDIGO DESBLOQUEADO";

            status.classList.add(
                "codigo-liberado"
            );


            document
                .getElementById("botaoCopiar")
                .disabled = false;


            /* Remove completamente a cobertura */

            setTimeout(function () {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

            }, 350);

        }


        /* =========================================
           COPIAR CÓDIGO
        ========================================= */

        document
            .getElementById("botaoCopiar")
            .addEventListener(
                "click",
                async function () {

                    try {

                        await navigator.clipboard.writeText(
                            codigoPremio
                        );

                    } catch (erro) {

                        const campo =
                            document.createElement(
                                "textarea"
                            );

                        campo.value =
                            codigoPremio;

                        document.body.appendChild(
                            campo
                        );

                        campo.select();

                        document.execCommand(
                            "copy"
                        );

                        campo.remove();

                    }


                    document.getElementById(
                        "textoCopiar"
                    ).textContent =
                        "CÓDIGO COPIADO!";


                    const mensagem =
                        document.getElementById(
                            "mensagemCopiado"
                        );

                    mensagem.classList.add(
                        "mostrar"
                    );


                    setTimeout(function () {

                        document.getElementById(
                            "textoCopiar"
                        ).textContent =
                            "COPIAR CÓDIGO";

                    }, 2000);

                }
            );

    </script>

</body>

</html>
